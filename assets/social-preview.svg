<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="Thats-me: an open-source cyber clone for research">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A101E"/>
      <stop offset="1" stop-color="#141F38"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5EEAD4"/>
      <stop offset="1" stop-color="#60A5FA"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#FFFFFF" stroke-opacity="0.045"/>
    </pattern>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#60A5FA" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#60A5FA" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <circle cx="1180" cy="60" r="300" fill="url(#glow)"/>
  <circle cx="80" cy="620" r="260" fill="url(#glow)" opacity="0.5"/>

  <g font-family="Inter, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif">
    <!-- badge -->
    <rect x="96" y="104" width="330" height="40" rx="20" fill="none" stroke="#2DD4BF" stroke-opacity="0.55"/>
    <circle cx="120" cy="124" r="5" fill="#2DD4BF"/>
    <text x="138" y="130" font-size="14" letter-spacing="2.4" fill="#7DD3C8" font-weight="600">OPEN SOURCE · CLONE KIT v1</text>

    <!-- title -->
    <text x="94" y="248" font-size="92" font-weight="700" fill="#F8FAFC" letter-spacing="-1.5">Thats-me</text>
    <text x="98" y="308" font-size="32" fill="#CBD5E1">我的赛博分身 · 一个会查账的科研 AI 助手</text>
    <text x="98" y="360" font-size="20" fill="#8DA2BF" letter-spacing="0.5">1 份行为手册　·　108 个科研技能　·　1 条诚信审计管线　·　0 平台依赖</text>

    <text x="98" y="430" font-size="19" fill="#64748B">把科研的门槛拆成可加载的文件：初学者也能一步步做出可复现的工作。</text>
    <text x="98" y="560" font-size="17" fill="#475569" letter-spacing="0.6">github.com/jiangfeng-strathclyde/Thats-me</text>
    <rect x="98" y="580" width="150" height="4" rx="2" fill="url(#accent)"/>

    <!-- protocol card -->
    <rect x="760" y="96" width="430" height="448" rx="20" fill="#0D1729" stroke="#22304A"/>
    <text x="790" y="140" font-size="13" letter-spacing="2.2" fill="#64748B" font-weight="600">LOAD-BEFORE-TASK PROTOCOL</text>
    <line x1="790" y1="158" x2="1160" y2="158" stroke="#22304A"/>

    <g font-size="17">
      <circle cx="802" cy="196" r="13" fill="#12233D" stroke="#2DD4BF" stroke-opacity="0.7"/>
      <text x="797.5" y="201.5" font-size="12" fill="#5EEAD4" font-weight="700">1</text>
      <text x="830" y="202" fill="#E2E8F0">读红线</text>
      <text x="912" y="202" fill="#64748B" font-size="15">DISTILLED_PUBLIC.md</text>

      <circle cx="802" cy="256" r="13" fill="#12233D" stroke="#2DD4BF" stroke-opacity="0.7"/>
      <text x="797.5" y="261.5" font-size="12" fill="#5EEAD4" font-weight="700">2</text>
      <text x="830" y="262" fill="#E2E8F0">定场景</text>
      <text x="912" y="262" fill="#64748B" font-size="15">ROUTING_TABLE.md</text>

      <circle cx="802" cy="316" r="13" fill="#12233D" stroke="#2DD4BF" stroke-opacity="0.7"/>
      <text x="797.5" y="321.5" font-size="12" fill="#5EEAD4" font-weight="700">3</text>
      <text x="830" y="322" fill="#E2E8F0">取技能</text>
      <text x="912" y="322" fill="#64748B" font-size="15">skills/&lt;name&gt;/SKILL.md</text>

      <circle cx="802" cy="376" r="13" fill="#12233D" stroke="#F59E0B" stroke-opacity="0.8"/>
      <text x="797.5" y="381.5" font-size="12" fill="#FBBF24" font-weight="700">4</text>
      <text x="830" y="382" fill="#E2E8F0">查证据</text>
      <text x="912" y="382" fill="#64748B" font-size="15">原始结果重算 · 不一致即停</text>

      <circle cx="802" cy="436" r="13" fill="#12233D" stroke="#60A5FA" stroke-opacity="0.8"/>
      <text x="797.5" y="441.5" font-size="12" fill="#93C5FD" font-weight="700">5</text>
      <text x="830" y="442" fill="#E2E8F0">再交付</text>
      <text x="912" y="442" fill="#64748B" font-size="15">代价清单 → 你点单</text>
    </g>

    <line x1="790" y1="478" x2="1160" y2="478" stroke="#22304A"/>
    <text x="790" y="512" font-size="15" fill="#5EEAD4">先当审稿人，再当助手。</text>
  </g>
</svg>
