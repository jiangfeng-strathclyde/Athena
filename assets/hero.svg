<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Athena: a research copilot that verifies before it writes">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A101E"/>
      <stop offset="1" stop-color="#141F38"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5EEAD4"/>
      <stop offset="1" stop-color="#60A5FA"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.045"/>
    </pattern>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#60A5FA" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#60A5FA" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="340" fill="url(#bg)"/>
  <rect width="1200" height="340" fill="url(#grid)"/>
  <circle cx="1120" cy="10" r="220" fill="url(#glow)"/>
  <circle cx="70" cy="330" r="200" fill="url(#glow)" opacity="0.5"/>

  <g font-family="Inter, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif">
    <!-- badge -->
    <rect x="72" y="56" width="282" height="32" rx="16" fill="none" stroke="#2DD4BF" stroke-opacity="0.55"/>
    <circle cx="92" cy="72" r="4" fill="#2DD4BF"/>
    <text x="106" y="77" font-size="12" letter-spacing="2.2" fill="#7DD3C8" font-weight="600">OPEN-SOURCE RESEARCH COPILOT</text>

    <!-- title -->
    <text x="70" y="172" font-size="66" font-weight="700" fill="#F8FAFC" letter-spacing="-1">Athena</text>
    <text x="72" y="212" font-size="23" fill="#CBD5E1">From research goal to verified result</text>
    <text x="72" y="248" font-size="14.5" fill="#8DA2BF" letter-spacing="0.4">109 research skills · evidence-first workflows · you stay in control</text>

    <text x="72" y="292" font-size="13" fill="#64748B">Describe your goal. Review the plan. Approve the work.</text>

    <!-- protocol card -->
    <rect x="690" y="50" width="446" height="244" rx="18" fill="#0D1729" stroke="#22304A"/>
    <text x="716" y="84" font-size="12" letter-spacing="2" fill="#64748B" font-weight="600">HOW ATHENA WORKS</text>
    <line x1="716" y1="98" x2="1110" y2="98" stroke="#22304A"/>

    <g font-size="14">
      <circle cx="726" cy="126" r="10" fill="#12233D" stroke="#2DD4BF" stroke-opacity="0.7"/>
      <text x="722.5" y="130.5" font-size="10" fill="#5EEAD4" font-weight="700">1</text>
      <text x="748" y="131" fill="#E2E8F0">You state a goal</text>
      <text x="866" y="131" fill="#64748B" font-size="12.5">question · draft · dataset</text>

      <circle cx="726" cy="160" r="10" fill="#12233D" stroke="#2DD4BF" stroke-opacity="0.7"/>
      <text x="722.5" y="164.5" font-size="10" fill="#5EEAD4" font-weight="700">2</text>
      <text x="748" y="165" fill="#E2E8F0">Athena builds a plan</text>
      <text x="914" y="165" fill="#64748B" font-size="12.5">skills · trade-offs</text>

      <circle cx="726" cy="194" r="10" fill="#12233D" stroke="#2DD4BF" stroke-opacity="0.7"/>
      <text x="722.5" y="198.5" font-size="10" fill="#5EEAD4" font-weight="700">3</text>
      <text x="748" y="199" fill="#E2E8F0">You review and approve</text>
      <text x="930" y="199" fill="#64748B" font-size="12.5">human control</text>

      <circle cx="726" cy="228" r="10" fill="#12233D" stroke="#F59E0B" stroke-opacity="0.8"/>
      <text x="722.5" y="232.5" font-size="10" fill="#FBBF24" font-weight="700">4</text>
      <text x="748" y="233" fill="#E2E8F0">Evidence is checked</text>
      <text x="904" y="233" fill="#64748B" font-size="12.5">recompute · cite · audit</text>

      <circle cx="726" cy="262" r="10" fill="#12233D" stroke="#60A5FA" stroke-opacity="0.8"/>
      <text x="722.5" y="266.5" font-size="10" fill="#93C5FD" font-weight="700">5</text>
      <text x="748" y="267" fill="#E2E8F0">You get a traceable result</text>
      <text x="946" y="267" fill="#64748B" font-size="12.5">no hidden leaps</text>
    </g>

    <!-- accent underline -->
    <rect x="70" y="306" width="120" height="3" rx="1.5" fill="url(#accent)"/>
  </g>
</svg>
