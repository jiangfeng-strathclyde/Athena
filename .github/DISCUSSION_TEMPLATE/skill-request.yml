title: "[skill-request] "
labels: ["skill-request"]
body:
  - type: textarea
    attributes:
      label: Requested skill or capability
      description: Describe the scenario, trigger phrases, expected inputs and outputs, and any upstream implementation.
    validations:
      required: true
  - type: checkboxes
    attributes:
      label: Safety and portability
      options:
        - label: The skill does not require reading or revealing credentials.
        - label: The skill contains no authorization-bypass instructions.
        - label: External-call failures are disclosed and do not produce fabricated results.
