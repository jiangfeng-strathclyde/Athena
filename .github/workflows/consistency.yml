name: repo-consistency

on:
  push:
  pull_request:

jobs:
  consistency:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Check README counts, links and demo numbers against the tree
        run: python scripts/check_repo_consistency.py
      - name: Skill QC (frontmatter hard checks + quality score report)
        run: python scripts/check_skills_quality.py
      - name: Recompute demo statistics independently
        run: python docs/demo_assets/verify_demo.py
      - name: Test installation, rollback, packaging, and installed numerical helper
        run: python -m unittest discover -s tests -v
      - name: Check the self-contained research entry point
        run: python scripts/check_skill_dependencies.py --skill research-integrity-pipeline --strict
      - name: Check the standalone arXiv adaptation
        run: python scripts/check_skill_dependencies.py --skill arxiv --strict
      - name: Report catalog packaging gaps (informational, not a runtime certification)
        run: python scripts/check_skill_dependencies.py
