name: external-links-weekly

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Probe external links in README and docs
        run: python scripts/check_external_links.py
